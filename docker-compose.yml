name: banking-foundation
services:
  discovery-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: discovery-server
    ports:
      - "127.0.0.1:8761:8761"
    volumes:
      - bank-logs:/var/log/bank
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/discovery-server.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8761/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  config-server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: config-server
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/config-server.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_REPO: file:/config/
    volumes:
      - ./infrastructure/config:/config:ro
      - bank-logs:/var/log/bank
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8888/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bank-logs:/var/log/bank
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/api-gateway.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      KEYCLOAK_ISSUER: http://localhost:8090/realms/banking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/token
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: auth-service
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - bank-logs:/var/log/bank
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/auth-service.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      KEYCLOAK_ISSUER: http://localhost:8090/realms/banking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/token
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  customer-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: customer-service
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - bank-logs:/var/log/bank
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/customer-service.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      SERVICE_CLIENT_SECRET: ${CUSTOMER_SERVICE_CLIENT_SECRET:?Run scripts/prepare-security-env.py}
      KEYCLOAK_ISSUER: http://localhost:8090/realms/banking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8083
      CUSTOMER_DB_URL: jdbc:mysql://customer-db:3306/customers?connectionTimeZone=UTC
      CUSTOMER_DB_USER: customer
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Generate .env first}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      customer-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  account-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: account-service
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - bank-logs:/var/log/bank
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/account-service.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      SERVICE_CLIENT_SECRET: ${ACCOUNT_SERVICE_CLIENT_SECRET:?Run scripts/prepare-security-env.py}
      KEYCLOAK_ISSUER: http://localhost:8090/realms/banking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_DB_URL: jdbc:mysql://account-db:3306/accounts?connectionTimeZone=UTC
      ACCOUNT_DB_USER: account
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Generate .env first}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      account-db:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  transaction-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: transaction-service
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - bank-logs:/var/log/bank
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/transaction-service.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      SERVICE_CLIENT_SECRET: ${TRANSACTION_SERVICE_CLIENT_SECRET:?Run scripts/prepare-security-env.py}
      KEYCLOAK_ISSUER: http://localhost:8090/realms/banking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8083
      TRANSACTION_DB_URL: jdbc:postgresql://transaction-db:5432/transactions
      TRANSACTION_DB_USER: transaction
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?Generate .env first}
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      transaction-db:
        condition: service_healthy
      account-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  notification-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        SERVICE: notification-service
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - bank-logs:/var/log/bank
    environment:
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?Run scripts/prepare-monitoring.py}
      BANK_LOG_FILE: /var/log/bank/notification-service.json
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      KEYCLOAK_ISSUER: http://localhost:8090/realms/banking
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_MONGO_URI: mongodb://notification-db:27017/notifications?retryWrites=false&w=majority&journal=true&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=3000&wtimeoutMS=3000
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      kafka:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-cp", "/app", "HealthCheck", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
  customer-db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: customers
      MYSQL_USER: customer
      MYSQL_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Generate .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env first}
    volumes:
      - customer-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
  account-db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: accounts
      MYSQL_USER: account
      MYSQL_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Generate .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env first}
    volumes:
      - account-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
  transaction-db:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transaction
      POSTGRES_PASSWORD: ${TRANSACTION_DB_PASSWORD:?Generate .env first}
    volumes:
      - transaction-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Generate .env first}
    volumes:
      - auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
  notification-db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - notification-db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Generate .env first}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8090
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=1GB"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.run/monitoring/prometheus-password:/etc/prometheus/password:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Generate .env first}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
  zipkin:
    image: openzipkin/zipkin:3.5
    environment:
      MEM_MAX_SPANS: 10000
    profiles: [monitoring]
    ports: ["127.0.0.1:9411:9411"]
    mem_limit: 512m
  elasticsearch:
    image: elasticsearch:8.17.6
    profiles: [monitoring]
    environment:
      discovery.type: single-node
      cluster.routing.allocation.disk.watermark.low: 1gb
      cluster.routing.allocation.disk.watermark.high: 768mb
      cluster.routing.allocation.disk.watermark.flood_stage: 512mb
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    ports: ["127.0.0.1:9200:9200"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  logstash:
    image: logstash:8.17.6
    profiles: [monitoring]
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./infrastructure/monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch: {condition: service_healthy}
    mem_limit: 768m
  filebeat:
    image: elastic/filebeat:8.17.6
    profiles: [monitoring]
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./infrastructure/monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - bank-logs:/var/log/bank:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on: [logstash]
    mem_limit: 256m
  kibana:
    image: kibana:8.17.6
    profiles: [monitoring]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      elasticsearch: {condition: service_healthy}
    ports: ["127.0.0.1:5601:5601"]
    mem_limit: 1g

volumes:
  customer-db:
  account-db:
  transaction-db:
  auth-db:
  notification-db:
  kafka-data:
  keycloak-data:
  bank-logs:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  filebeat-data:
