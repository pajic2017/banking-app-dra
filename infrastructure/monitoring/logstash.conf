input { beats { port => 5044 } }
filter {
  # Never ingest authorization headers or payloads; instrumentation records metadata only.
  mutate { gsub => ["message", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", "[redacted-email]", "[error][stack_trace]", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", "[redacted-email]", "[error][message]", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", "[redacted-email]", "message", "eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", "[redacted-token]"] }
  mutate { remove_field => ["authorization", "password", "access_token", "refresh_token"] }
}
output { elasticsearch { hosts => ["http://elasticsearch:9200"] index => "bank-logs-%{+YYYY.MM.dd}" } }
