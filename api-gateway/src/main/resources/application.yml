server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  config:
    import: "${CONFIG_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

---
bank:
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8090/realms/banking}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/banking/protocol/openid-connect/certs}

---
bank:
  monitoring:
    password: ${MONITORING_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: ${BANK_LOG_FILE:.run/logs/api-gateway.json}
spring:
  reactor:
    context-propagation: auto
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
