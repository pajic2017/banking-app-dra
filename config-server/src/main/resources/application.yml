server:
  port: ${PORT:8888}
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      enabled: false
      server:
        native:
          search-locations: "${CONFIG_REPO:file:./infrastructure/config/}"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
