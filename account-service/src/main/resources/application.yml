server:
  port: ${PORT:8083}
spring:
  application:
    name: account-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
  config:
    import: "${CONFIG_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}"
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://localhost:3308/accounts?connectionTimeZone=UTC}
    username: ${ACCOUNT_DB_USER:account}
    password: ${ACCOUNT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
bank:
  events:
    relay-enabled: ${BANK_EVENTS_RELAY_ENABLED:true}
  customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
# JSON is explicitly versioned, not Java type-header deserialization.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
