server:
  port: ${PORT:8761}
spring:
  application:
    name: discovery-server
  cloud:
    config:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
