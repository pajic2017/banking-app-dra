server:
  port: ${PORT:8761}
spring:
  application:
    name: discovery-server
  cloud:
    config:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

---
bank:
  monitoring:
    password: ${MONITORING_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
    propagation:
      type: w3c
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: ${BANK_LOG_FILE:.run/logs/discovery-server.json}
spring:
  reactor:
    context-propagation: auto
  kafka:
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
