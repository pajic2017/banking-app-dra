server:
  port: ${PORT:8084}
spring:
  application:
    name: transaction-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
  config:
    import: "${CONFIG_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}"
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5433/transactions}
    username: ${TRANSACTION_DB_USER:transaction}
    password: ${TRANSACTION_DB_PASSWORD}
  flyway:
    enabled: true
bank:
  events:
    relay-enabled: ${BANK_EVENTS_RELAY_ENABLED:true}
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
  processing:
    enabled: ${TRANSACTION_PROCESSING_ENABLED:true}
# JSON is explicitly versioned, not Java type-header deserialization.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
