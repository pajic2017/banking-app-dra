plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}
allprojects {
    group = 'com.bank'
    version = '0.1.0-SNAPSHOT'
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java'
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    if (name != 'common-contracts') {
        apply plugin: 'org.springframework.boot'
        apply plugin: 'io.spring.dependency-management'
        dependencyManagement {
            imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3' }
        }
        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'io.micrometer:micrometer-registry-prometheus'
            implementation 'io.micrometer:micrometer-tracing-bridge-otel'
            implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
            implementation 'org.springframework.cloud:spring-cloud-starter-config'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
        tasks.named('bootJar') { archiveFileName = 'app.jar' }
    }
}

// Compile the dependency-free container probe with the same Java bytecode target.
tasks.register('compileContainerHealthCheck', Exec) {
    inputs.file('infrastructure/docker/HealthCheck.java')
    outputs.file(layout.buildDirectory.file('docker-probe/HealthCheck.class'))
    doFirst { layout.buildDirectory.dir('docker-probe').get().asFile.mkdirs() }
    commandLine "${System.getenv('JAVA_HOME') ?: System.getProperty('java.home')}/bin/javac",
        '--release', '17', '-d', layout.buildDirectory.dir('docker-probe').get().asFile,
        file('infrastructure/docker/HealthCheck.java')
}
subprojects {
    plugins.withId('org.springframework.boot') {
        tasks.named('bootJar') { dependsOn rootProject.tasks.named('compileContainerHealthCheck') }
    }
}
